name: PR Issue Reference Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - dev

jobs:
  validate-pr-description:
    runs-on: ubuntu-latest

    steps:
      - name: Skip validation on push
        if: github.event_name == 'push'
        run: echo "Push event - skipping PR validation."
  
      - name: Validate PR contains issue reference
        if: github.event_name == 'pull_request'
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          echo "Checking PR description..."

          if [[ ! "$PR_BODY" =~ Closes\ #[0-9]+ ]]; then
            echo "❌ PR must contain: Closes #<issue-number>"
            echo ""
            echo "Example:"
            echo "Closes #1"
            exit 1
          fi

          echo "✅ PR references an issue correctly."